plugins {
    id 'java-gradle-plugin'
}

// Bootstrap build so the conventions plugin can be applied to its own build.
// It compiles the exact same sources as the published plugin.

repositories {
    mavenCentral()
    gradlePluginPortal()
}

ext.conventionsPluginDir = '..'
apply from: "${conventionsPluginDir}/gradle/conventions-sources.gradle"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(conventionVersions['conventions.javaMajor'] as int)
}

sourceSets.main.java.srcDirs = ['../src/main/java']

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

gradlePlugin {
    plugins {
        conventions {
            id = 'com.cleanroommc.conventions.bootstrap'
            implementationClass = 'com.cleanroommc.conventions.ConventionsPlugin'
        }
    }
}
