# Single source of truth for the convention files packed into the plugin jar.
# Format is <path relative to the repository root>=<path inside the jar resources>.
# It is read by both gradle-plugin/build.gradle and gradle-plugin/build-logic/build.gradle:
# keep the two pack tasks in sync by editing this file instead of either build script.
checkstyle.xml=checkstyle.xml
formatj.toml=formatj.toml
cliff.toml=cliff.toml
LICENSE=LICENSE
HEADER=HEADER
licenses/free/LICENSE=licenses/free/LICENSE
licenses/free/HEADER=licenses/free/HEADER
licenses/open/LICENSE=licenses/open/LICENSE
licenses/open/HEADER=licenses/open/HEADER
.editorconfig=editorconfig
.gitattributes=gitattributes
.gitignore=gitignore
